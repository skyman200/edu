<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 수업 자동화 키트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap">
<style>
:root{--ink:#1a1a1a;--ink2:#4a4a4a;--mute:#8e8e8e;--line:#d2d2d2;--red:#e54536}
*{box-sizing:border-box}
html{background:#e9e9e9}
body{margin:0;color:var(--ink);font:10.5pt/1.65 Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all;-webkit-font-smoothing:antialiased}
.bar{position:sticky;top:0;z-index:5;padding:14px 20px;background:#fff;border-bottom:1px solid var(--ink)}
.bar .in{max-width:210mm;margin:0 auto}
.bar h1{margin:0 0 4px;font-size:17px}
.bar p{margin:0 0 10px;color:var(--ink2);font-size:13px}
.bar .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.bar input[type=text]{flex:1 1 200px;min-width:0;padding:9px 11px;border:1px solid #bcbcbc;border-radius:2px;font:14px Pretendard,sans-serif}
.bar label{font-size:13px;color:var(--ink2);display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.bar button{padding:10px 18px;border:1px solid var(--ink);border-radius:2px;background:var(--ink);color:#fff;font:700 14px Pretendard,sans-serif;cursor:pointer}
.bar .note{font-size:12px;color:var(--mute)}
#doc{max-width:210mm;margin:18px auto 60px;background:#fff;padding:16mm 16mm 20mm;box-shadow:0 0 0 1px #d0d0d0}
.k{display:inline-block;margin:0 0 10px;padding-left:8px;border-left:3px solid var(--red);font:700 8pt/1.1 Montserrat,Pretendard,sans-serif;letter-spacing:.26em;color:var(--ink2)}
h2{margin:0 0 6px;font-size:21pt;font-weight:800;letter-spacing:-.025em;line-height:1.25}
h3{margin:16pt 0 5pt;padding-top:6pt;border-top:1px solid var(--ink);font:700 8.5pt/1.2 Montserrat,Pretendard,sans-serif;letter-spacing:.2em;color:var(--ink2)}
p{margin:0 0 6pt}
.sec{break-before:page}
.sec:first-child{break-before:auto}
.cover{min-height:255mm;display:flex;flex-direction:column;justify-content:space-between}
.cover h2{font-size:34pt;line-height:1.15;margin-top:30mm}
.cover .for{margin-top:14mm;padding-top:6mm;border-top:3px solid var(--ink)}
.cover .for b{display:block;font-size:20pt;letter-spacing:-.02em}
.cover .for span{color:var(--ink2);font-size:12pt}
.cover .cnt{margin-top:6mm;font-size:13pt;font-weight:700}
.cover .qrrow{display:flex;gap:6mm;align-items:center}
.cover .qr svg{width:30mm;height:30mm;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:9.5pt;margin:4pt 0 8pt}
th,td{padding:5pt 7pt;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{width:26%;font-weight:700}
.box{margin:8pt 0 10pt;padding:8pt 11pt;border-left:4px solid var(--red);background:#f6f6f6}
.box b{display:block;margin-bottom:2pt;font:700 8pt/1.3 Montserrat,Pretendard,sans-serif;letter-spacing:.2em;color:var(--ink2)}
ol,ul{margin:0 0 6pt;padding-left:16pt}
li{margin:0 0 3pt}
.pr{margin:0 0 9pt;break-inside:avoid}
.pr .n{font:700 8pt/1.3 Montserrat,Pretendard,sans-serif;letter-spacing:.14em;color:var(--red)}
.pr .p{margin:3pt 0;padding:6pt 9pt;border:1px solid var(--ink);background:#fff;font-size:9.5pt}
.pr .r{padding-left:9pt;color:var(--ink2);font-size:9.5pt}
.url{display:flex;gap:5mm;align-items:center;margin:0 0 6pt;padding:6pt;border:1px solid var(--line);break-inside:avoid}
.url svg{flex:none;width:26mm;height:26mm}
.url code{display:block;font-size:7.5pt;word-break:break-all}
.url b{font-size:9.5pt}
.rb{margin:0 0 12pt;padding:8pt 10pt;border:1px solid var(--line);break-inside:avoid;page-break-inside:avoid}
.rb .rt{display:block;font-size:13pt;font-weight:800;letter-spacing:-.02em}
.rb .rm{margin:0 0 6pt;color:var(--ink2);font-size:9pt}
.rb .pn{margin:6pt 0 3pt;font:700 8.5pt/1.3 Pretendard,sans-serif;letter-spacing:0;color:var(--ink2)}
.rb ol{margin:0 0 4pt}
.rb li{white-space:pre-wrap;overflow-wrap:anywhere}
pre{margin:0;padding:6pt 8pt;border:1px solid var(--line);background:#fafafa;font:6.6pt/1.45 Menlo,Consolas,"D2Coding",monospace;white-space:pre-wrap;word-break:break-all}
@page{size:A4;margin:14mm 16mm 18mm}
/* 버튼 결과 알림: 화면 아래 가운데. 인쇄물에는 나오지 않습니다. */
.toast{position:fixed;left:50%;bottom:28px;z-index:90;display:flex;align-items:flex-start;gap:12px;width:max-content;max-width:min(560px,calc(100vw - 32px));padding:12px 16px 14px;overflow:hidden;background:#1a1a1a;color:#fff;border-radius:2px;font:500 14px/1.5 Pretendard,sans-serif;word-break:keep-all;transform:translate(-50%,14px);opacity:0;pointer-events:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s}
.toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast b{flex:none;padding-right:12px;border-right:1px solid rgba(255,255,255,.35);font-size:12px;font-weight:800;letter-spacing:.12em;line-height:21px}
.toast i{position:absolute;left:0;right:0;bottom:0;height:3px;background:#e54536;transform-origin:0 50%;transform:scaleX(0)}
.toast.run i{animation:tbar 3s linear forwards}@keyframes tbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.toast.bad{background:#e54536}
.toast button{flex:none;margin:-3px -6px -3px 4px;padding:3px 11px;border:1px solid #fff;border-radius:2px;background:transparent;color:#fff;font:600 13px Pretendard,sans-serif;cursor:pointer}
@media print{.toast{display:none}}
@media print{
  html{background:#fff}
  .bar{display:none}
  #doc{max-width:none;margin:0;padding:0;box-shadow:none}
}
</style>
</head>
<body>
<div class="bar"><div class="in">
  <h1>AI 수업 자동화 키트 (PDF)</h1>
  <p>성함과 소속을 적으면 표지와 모든 쪽 아래에 들어갑니다. 적지 않아도 만들어집니다. 웹 도구에서 만든 내 결과물이 있으면 주소와 QR, 내가 AI에게 한 말, 코드가 함께 들어갑니다.</p>
  <div class="row"><input type="text" id="nm" placeholder="성함 (선택, 예: 김서연)"><input type="text" id="org" placeholder="소속 (선택, 예: 부산외대 경영학과)"></div>
  <div class="row" id="picks"></div>
  <div class="row"><label><input type="checkbox" id="withVibe" checked> 수업용 웹앱 만들기(미션 2) 포함</label><label><input type="checkbox" id="withCode" checked> 코드 전문 포함(쪽수가 늘어납니다)</label><button id="save">PDF로 저장</button><span class="note" id="hint">누르면 인쇄 창이 열립니다. 대상을 "PDF로 저장"으로 두고 저장하세요. 파일 이름은 자동으로 채워집니다.</span></div>
</div></div>
<div id="doc"></div>
<style id="pg"></style>
<script src="vendor/qrcode/qrcode.js"></script>
<script src="gas-recipes.js"></script>
<script src="vibe-kit.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var DATA = window.GAS_RECIPES, Q = new URLSearchParams(location.search);
  var SITE = 'https://kimcook-edu.pages.dev/#gas';
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function qr(text) {
    if (typeof qrcode !== 'function') return null;
    var q = qrcode(0, 'M'); q.addData(text); q.make();
    var n = q.getModuleCount(), d = '';
    for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) if (q.isDark(y, x)) d += 'M' + x + ',' + y + 'h1v1h-1z';
    var b = el('div'); b.innerHTML = '<svg viewBox="-3 -3 ' + (n + 6) + ' ' + (n + 6) + '" shape-rendering="crispEdges"><rect x="-3" y="-3" width="' + (n + 6) + '" height="' + (n + 6) + '" fill="#fff"/><path d="' + d + '"/></svg>';
    return b.firstChild;
  }
  var nm = $('#nm'), org = $('#org'), withCode = $('#withCode');
  nm.value = Q.get('name') != null ? Q.get('name') : lsGet('acl-kit-name', '');
  org.value = Q.get('org') != null ? Q.get('org') : lsGet('acl-kit-org', '');
  // 수업 코드는 PDF에 넣지 않습니다: EMBEDDED_CODE 선언 줄을 지우고, 저장된 수업 코드 값도 바꿉니다.
  var AICODE = lsGet('acl-aicode', '');
  function scrub(s) {
    s = String(s == null ? '' : s).replace(/^\s*var\s+EMBEDDED_CODE\s*=.*;[ \t]*\r?\n?/gm, '');
    return typeof AICODE === 'string' && AICODE.length >= 4 ? s.split(AICODE).join('(수업 코드)') : s;
  }
  function loadResults() {
    var a = lsGet('acl-gas-results', []);
    if (!Array.isArray(a)) return [];
    return a.filter(function (x) { return x && typeof x.r === 'string' && typeof x.title === 'string' && DATA.recipes.some(function (r) { return r.id === x.r; }); }).map(function (x) {
      return { r: x.r, title: x.title, url: typeof x.url === 'string' ? x.url : '', code: typeof x.code === 'string' ? scrub(x.code) : '',
        prompts: Array.isArray(x.prompts) ? x.prompts.filter(function (p) { return typeof p === 'string' && p; }).map(scrub).filter(Boolean) : [], t: Number(x.t) || 0, u: Number(x.u) || Number(x.t) || 0 };
    }).sort(function (a, b) { return a.t - b.t; });
  }
  var RES = loadResults();
  var saved = lsGet('acl-kit-recipes', null);
  // 기본 선택 = (저장해 둔 선택, 없으면 전체) + 결과물이 있는 레시피. ?r= 로 지정하면 그대로 따릅니다.
  var chosen = Q.get('r') ? Q.get('r').split(',') : Array.isArray(saved) ? saved.concat(RES.map(function (x) { return x.r; })) : null;
  var recs = DATA.recipes.filter(function (r) { return r.id !== 'blank'; });
  var blank = DATA.recipes.filter(function (r) { return r.id === 'blank'; })[0];
  function urlOf(id) {
    var best = null;
    RES.forEach(function (x) { if (x.r === id && x.url && (!best || x.u >= best.u)) best = x; });
    return best ? best.url : '';
  }
  function fmtT(t) { var d = new Date(t); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function recipeName(id) { var r = DATA.recipes.filter(function (x) { return x.id === id; })[0]; return r ? r.name : id; }
  function linksOf(id) { var r = DATA.recipes.filter(function (x) { return x.id === id; })[0]; return (r && r.web && r.web.links && r.web.links.length) ? r.web.links : [{ label: '학생용 주소', suffix: '' }]; }
  var picks = $('#picks');
  recs.concat([blank]).forEach(function (r) {
    var lab = el('label'), cb = el('input'); cb.type = 'checkbox'; cb.value = r.id; cb.checked = chosen ? chosen.indexOf(r.id) >= 0 : true;
    cb.onchange = function () { render(); };
    lab.appendChild(cb); lab.appendChild(document.createTextNode(' ' + r.name)); picks.appendChild(lab);
  });
  function selected() { return Array.prototype.map.call(picks.querySelectorAll('input:checked'), function (c) { return c.value; }); }
  function who() { var n = nm.value.trim(), o = org.value.trim(); return { n: n, o: o, line: [o, n ? n + ' 교수님' : ''].filter(Boolean).join(' · ') }; }

  // 키트는 혼자 쓰는 판(내 Gemini 키) 기준입니다: 강사 서버의 판정 모델 이름(Jev)은 "AI"로 읽습니다.
  function S(t) { return String(t).replace(/Jev가/g, 'AI가').replace(/JEV 판정/g, 'AI 판정').replace(/Jev/g, 'AI'); }
  function add(parent, tag, cls, text) { var e = el(tag, cls, text); parent.appendChild(e); return e; }
  function stories(parent, r) {
    add(parent, 'p', '', '아래 프롬프트는 이 코드가 어떤 요구에서 나왔는지를 단계별로 다시 정리한 것입니다. AI는 같은 프롬프트에도 매번 조금 다른 코드를 만듭니다. 그대로 따라 하면 비슷한 코드가 나오고, 마음에 들지 않으면 같은 방식으로 한 단계씩 고쳐 말하면 됩니다.');
    r.story.forEach(function (s, i) {
      var d = add(parent, 'div', 'pr');
      add(d, 'div', 'n', 'STEP ' + (i + 1) + ' · ' + S(s.step));
      add(d, 'div', 'p', S(s.prompt));
      add(d, 'div', 'r', '→ ' + S(s.result));
    });
  }
  function urlCards(parent, id, u) {
    linksOf(id).forEach(function (L) {
      // 큰 화면 주소에는 참여 QR용 학생 주소(join)를 붙입니다(gas.html linkUrl 과 같은 규칙). 그 주소의 QR은 찍을 일이 없어 그리지 않습니다.
      var full = u + L.suffix + (L.join ? (L.suffix.indexOf('?') < 0 ? '?' : '&') + 'join=' + encodeURIComponent(u) : ''), row = add(parent, 'div', 'url'), q = L.join ? '' : qr(full), t = add(row, 'div');
      if (q) row.insertBefore(q, t);
      add(t, 'b', '', L.label); add(t, 'code', '', full);
    });
  }
  function resultsSection(root, shown, withC) {
    var s = add(root, 'section', 'sec');
    add(s, 'div', 'k', 'MY RESULTS'); add(s, 'h2', '', '내가 만든 결과물');
    add(s, 'p', '', '웹 도구에서 직접 만든 결과물입니다. 주소와 QR로 학생에게 나눠 주고, "내가 AI에게 한 말"은 같은 결과물을 다시 만들 때 그대로 쓸 수 있습니다.');
    shown.forEach(function (x) {
      var b = add(s, 'div', 'rb');
      add(b, 'b', 'rt', x.title);
      add(b, 'div', 'rm', recipeName(x.r) + (x.t ? ' · 만든 날 ' + fmtT(x.t) : '') + (x.u ? ' · 고친 날 ' + fmtT(x.u) : ''));
      if (x.url) urlCards(b, x.r, x.url);
      if (x.prompts.length) { add(b, 'div', 'pn', '내가 AI에게 한 말'); var ol = add(b, 'ol'); x.prompts.forEach(function (p) { add(ol, 'li', '', p); }); }
      if (x.code && withC) add(b, 'p', '', "코드는 부록 '내 코드'에 있습니다.");
    });
  }
  function recipeSection(root, r, no) {
    var s = add(root, 'section', 'sec');
    add(s, 'div', 'k', 'RECIPE ' + String(no).padStart(2, '0'));
    add(s, 'h2', '', r.name);
    add(s, 'p', '', r.tag + ' · ' + S(r.short));
    var w = add(s, 'div', 'box'); add(w, 'b', '', 'WOW POINT'); w.appendChild(document.createTextNode(S(r.wow)));
    var web = r.web || {}, u = urlOf(r.id);
    add(s, 'h3', '', '1 · 시작하기');
    var ol = add(s, 'ol');
    ['https://sheets.new 로 새 구글 시트를 엽니다.', '확장 프로그램 → Apps Script를 열고 기존 글을 모두 지운 뒤, 이 문서 부록의 "공통 도우미"와 "' + r.name + '" 코드를 차례로 붙여 넣고 저장합니다. (웹 도구가 열리면 "코드 복사" 버튼 하나로 끝납니다.)',
      '위쪽 함수 선택 칸에서 start 를 골라 ▶ 실행합니다. 승인 화면이 나오면 허용하고, AI 키를 묻는 칸이 뜨면 aistudio.google.com/apikey 에서 만든 키(AIza로 시작)를 붙여 넣습니다.']
      .concat(web.deploy ? ['배포 → 새 배포 → 웹 앱(실행: 나, 액세스: 모든 사용자)으로 배포하고 /exec 로 끝나는 웹 앱 URL을 복사해 시트 메뉴의 "웹 앱 주소 넣기"에 붙여 넣습니다. 학생에게는 이 주소를 LMS나 QR로 나눠 줍니다.'] : [])
      .concat(web.after || []).forEach(function (t) { add(ol, 'li', '', S(t)); });
    if (u) {
      add(s, 'h3', '', '내 주소 (웹 도구에서 만든 가장 최근 결과물)');
      urlCards(s, r.id, u);
    }
    add(s, 'h3', '', '2 · 프롬프트 기록: 이 코드는 이렇게 만들어졌습니다');
    stories(s, r);
    add(s, 'h3', '', '3 · 고쳐 쓸 때 바로 써 보는 프롬프트');
    var ul = add(s, 'ul'); r.examples.forEach(function (t) { add(ul, 'li', '', S(t)); });
    if (r.jev && r.jev.length) { add(s, 'h3', '', 'AI가 판정하는 것'); var jl = add(s, 'ul'); r.jev.forEach(function (t) { add(jl, 'li', '', S(t)); }); }
  }
  // 수업용 웹앱 만들기(미션 2): 강사 서버·수업 코드 없이, 파일 하나(studio.html)와 아무 AI 채팅만으로 혼자 해 보는 순서.
  function vibeSection(root, withC) {
    var S = VIBE_SAMPLES, STUDIO = 'https://kimcook-edu.pages.dev/studio.html';
    var s = add(root, 'section', 'sec');
    add(s, 'div', 'k', 'CLASS APP STUDIO'); add(s, 'h2', '', '수업용 웹앱: 예시를 먼저 띄우고, 말로 바꿔 가기');
    add(s, 'p', '', '강사도 수업 코드도 필요 없습니다. 예시 앱 9개가 들어 있는 파일 하나(studio.html)와 아무 AI 채팅(Claude, ChatGPT, Gemini 등)만 있으면 혼자 끝까지 할 수 있습니다. 한 번에 약 10분입니다.');
    var row = add(s, 'div', 'url'), q = qr(STUDIO), tx = add(row, 'div');
    if (q) row.insertBefore(q, tx);
    add(tx, 'b', '', '스튜디오 (studio.html)'); add(tx, 'code', '', STUDIO);
    add(s, 'p', '', '한 번 연 뒤 브라우저의 "다른 이름으로 저장"(Ctrl+S, 맥 ⌘+S)으로 저장해 두면 이 주소가 닫혀도 파일만으로 열립니다.');
    add(s, 'h3', '', '1 · 혼자 해 보는 순서');
    var ol = add(s, 'ol');
    ['studio.html을 엽니다. 예시 앱을 하나 누르면 오른쪽에서 바로 돌아갑니다. 먼저 써 보세요.',
      '바꾸고 싶은 것을 한 문장으로 적습니다. (예: "' + S[0].ask + '")',
      '"AI에게 보낼 글 복사"를 누르고 아무 AI 채팅에 붙여 넣습니다. 지금 코드와 "바뀐 곳만 알려 줘"라는 형식이 함께 들어갑니다.',
      'AI의 답을 통째로 복사해 03 칸에 붙여 넣고 "답 반영하고 실행"을 누릅니다. 바뀐 곳만 알아서 끼워 넣고, 마음에 안 들면 "되돌리기"를 누릅니다.',
