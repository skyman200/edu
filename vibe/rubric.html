<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>루브릭 점수 계산기</title>
<style>
  :root { --paper: #F2F2F2; --ink: #1A1A1A; --mute: #6B6B6B; --line: #BCBCBC; --red: #E54536; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 20px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .hint { color: var(--mute); margin: 0 0 18px; }
  input { width: 140px; min-height: 44px; font-size: 18px; padding: 6px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink); }
  .rows { margin-top: 12px; border-top: 1px solid var(--ink); }
  .row { display: grid; grid-template-columns: 200px 1fr 80px; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .name { font-size: 20px; font-weight: 700; }
  small { font-size: 14px; font-weight: 400; }
  .name small { display: block; }
  .lv { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  button { min-height: 44px; font: inherit; font-size: 18px; padding: 8px 14px; border: 1px solid var(--ink); border-radius: 4px; background: transparent; color: var(--ink); cursor: pointer; }
  button.on, button.main { background: var(--ink); color: #fff; }
  .pt { text-align: right; font-size: 20px; }
  .sum { display: flex; align-items: baseline; gap: 20px; margin: 20px 0 4px; }
  .total { font: 800 clamp(64px, 14vw, 120px)/1 sans-serif; }
  .total small { font-size: .35em; }
  .grade { font-size: 56px; font-weight: 800; color: var(--red); }
  .note { color: var(--mute); margin: 0 0 14px; }
  textarea { width: 100%; min-height: 160px; font: inherit; font-size: 17px; padding: 8px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink); resize: vertical; }
  .btns { display: flex; gap: 8px; margin-top: 12px; }
  @media (max-width: 700px) { .row { grid-template-columns: 1fr auto; } .lv { grid-column: 1 / -1; grid-row: 2; } .lv button { padding: 8px 2px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>루브릭 점수 계산기</h1>
  <p class="hint">기준마다 단계를 누르면 점수와 피드백이 나옵니다.</p>
  <label>학생 번호(선택) <input id="sid" placeholder="예: 12"></label>
  <div class="rows" id="rows"></div>
  <div class="sum"><div class="total"><span id="total">0</span> <small>/ 100</small></div><div class="grade" id="grade">-</div></div>
  <p class="note" id="note"></p>
  <textarea id="fb" aria-label="피드백"></textarea>
  <div class="btns"><button class="main" id="copy">결과 복사</button><button id="reset">모두 초기화</button></div>
  <p class="note" id="msg"></p>
</div>
<script>
  // 여기를 고치면 내용이 바뀝니다
  const RUBRIC = { criteria: [
    { name: '내용 충실성', weight: 30, levels: [
      { label: '우수', score: 1, comment: '핵심을 근거 있게 다루었습니다.' },
      { label: '양호', score: .8, comment: '근거가 조금 더 필요합니다.' },
      { label: '보통', score: .6, comment: '깊이가 부족합니다.' },
      { label: '미흡', score: .4, comment: '핵심이 빠져 보완이 필요합니다.' } ] },
    { name: '구성과 논리', weight: 25, levels: [
      { label: '우수', score: 1, comment: '서론, 본론, 결론이 매끄럽습니다.' },
      { label: '양호', score: .8, comment: '구성은 좋으나 연결이 일부 어색합니다.' },
      { label: '보통', score: .6, comment: '논리 연결이 약합니다.' },
      { label: '미흡', score: .4, comment: '구성이 흩어졌습니다.' } ] },
    { name: '전달력', weight: 25, levels: [
      { label: '우수', score: 1, comment: '목소리와 시선이 자연스럽습니다.' },
      { label: '양호', score: .8, comment: '전달은 명확하나 시선이 아쉽습니다.' },
      { label: '보통', score: .6, comment: '청중과의 소통이 부족합니다.' },
      { label: '미흡', score: .4, comment: '전달이 약해 보완이 필요합니다.' } ] },
    { name: '시간 준수', weight: 20, levels: [
      { label: '우수', score: 1, comment: '시간을 정확히 지켰습니다.' },
      { label: '양호', score: .8, comment: '시간을 거의 지켰으나 배분이 아쉽습니다.' },
      { label: '보통', score: .6, comment: '시간이 다소 남거나 넘었습니다.' },
      { label: '미흡', score: .4, comment: '시간 차이가 커 핵심을 못 전했습니다.' } ] }
  ] };
  const $ = id => document.getElementById(id);
  const C = RUBRIC.criteria;
  let pick = C.map(() => -1);
  C.forEach((c, i) => {
    const row = document.createElement('div'); row.className = 'row';
    const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = c.name;
    nm.append(Object.assign(document.createElement('small'), { textContent: c.weight + '점 만점' }));
    const lv = document.createElement('div'); lv.className = 'lv';
    c.levels.forEach((l, j) => {
      const b = document.createElement('button'); b.textContent = l.label;
      b.onclick = () => { pick[i] = pick[i] === j ? -1 : j; render(); };
      lv.appendChild(b);
    });
    const pt = document.createElement('div'); pt.className = 'pt';
    row.append(nm, lv, pt); $('rows').appendChild(row);
  });
  const score = (c, j) => Math.round(c.weight * c.levels[j].score * 10) / 10;
  function lines() {
    return C.map((c, i) => pick[i] < 0 ? '' : c.name + ': ' + c.levels[pick[i]].comment).filter(Boolean);
  }
  function render() {
    let sum = 0, left = 0;
    [...$('rows').children].forEach((row, i) => {
      [...row.querySelectorAll('button')].forEach((b, j) => b.classList.toggle('on', pick[i] === j));
      const pt = row.querySelector('.pt');
      if (pick[i] < 0) { pt.textContent = '미선택'; left++; }
      else { const s = score(C[i], pick[i]); sum += s; pt.textContent = s + '점'; }
    });
    sum = Math.round(sum * 10) / 10;
    $('total').textContent = sum;
    $('grade').textContent = left === C.length ? '-' : sum >= 90 ? 'A' : sum >= 80 ? 'B' : sum >= 70 ? 'C' : 'D';
    $('note').textContent = left ? '아직 고르지 않은 기준 ' + left + '개' : '모든 기준을 골랐습니다.';
    $('fb').value = lines().join('\n');
  }
  function report() {
    const id = $('sid').value.trim();
    return '[루브릭] ' + (id ? '학생 ' + id + '번 ' : '') + '총점 ' + $('total').textContent + ' / 100, 등급 ' + $('grade').textContent + '\n' + $('fb').value;
  }
  $('copy').onclick = async () => {
    try { await navigator.clipboard.writeText(report()); $('msg').textContent = '복사했습니다.'; }
    catch (e) { $('fb').focus(); $('fb').select(); $('msg').textContent = '복사가 막혔습니다. 위 글을 직접 복사하세요.'; }
  };
  $('reset').onclick = () => { pick = C.map(() => -1); $('sid').value = ''; $('msg').textContent = ''; render(); };
  render();
</script>
</body>
</html>
